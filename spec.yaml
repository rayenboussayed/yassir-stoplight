openapi: 3.0.3
info:
  title: Intercity Mock API
  version: 1.0.0

servers:
  - url: http://localhost:4010

components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization  # optional, for documentation

paths:
  /intercity/v1/trips/history/{tripId}:
    get:
      summary: Get detailed information about a specific intercity trip for a rider. actual path will be <baseurl>/b2c/rider/
      description: Retrieves detailed information about a single intercity trip. Includes ownership verification to ensure the rider has access to the trip.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the trip

        - name: app_language
          in: header
          required: false
          schema:
            type: string
          description: Preferred language for the response (e.g. en, fr, ar)

      responses:
        "200":
          description: Successful response with trip details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  trip:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      tripUid:
                        type: string
                        example: "ABC123"
                      status:
                        type: string
                        enum:
                          - COMPLETED
                          - SCHEDULED
                          - CANCELED
                        example: "SCHEDULED"

                      pickup:
                        type: object
                        properties:
                          address:
                            type: string
                            example: "123 Main St"
                          city:
                            type: string
                            example: "Blida"
                          departureTime:
                            type: string
                            format: date-time
                            example: "2026-02-10T08:00:00.000Z"

                      destination:
                        type: object
                        properties:
                          address:
                            type: string
                            example: "456 Elm St"
                          city:
                            type: string
                            example: "Oran"
                          arrivalTime:
                            type: string
                            format: date-time
                            example: "2026-02-10T08:00:00.000Z"

                      price:
                        type: number
                        example: 2500
                  

                      riderPay:
                        type: object
                        properties:
                          amount:
                            type: number 
                            example: 2500
                              
                          amountWithoutTax:
                            type: number 
                            example: 2000             
                          tax: 
                            type: array
                            items:
                              type: object    
                              properties:             
                                label:
                                  type: string
                                  example: TAX1
                                amount:
                                  type: number
                                  example: 500
                      currency:
                        type: string
                        example: "DZD"

                      currencyLabel:
                        type: string
                        example: "DA"

                      remainingSeats:
                        type: number
                        example: 2

                      maxSeats:
                        type: number
                        example: 4

                      driverProfile:
                        type: object
                        properties:
                          id:
                            type: string
                            example: "driver123"
                          name:
                            type: string
                            example: "John Doe"
                          phone:
                            type: string
                            example: "+213600000000"
                          rating:
                            type: number
                            example: 4.8
                          picture:
                            type: string
                            example: "https://example.com/profile.jpg"
                          car:
                            type: object
                            properties:
                              make:
                                type: string
                                example: Toyota
                              model:
                                type: string
                                example: MarkX
                              color:
                                type: string
                                example: White
                              plateNumber:
                                type: string
                                example: ABC-123
                      bookings:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            isPrivate:
                              type: boolean
                            seats:
                              type: number
                            riderProfile:
                              type: object
                              properties:
                                id:
                                  type: string
                                rider:
                                  type: string
                                email:
                                  type: string
                                fullName:
                                  type: string
                                firstName:
                                  type: string
                                lastName:
                                  type: string
                                gender:
                                  type: string
                                phone:
                                  type: string
                                rating:
                                  type: number
                                reviewCount:
                                  type: number
        "400":
          description: Bad request - missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorMessageKey:
                    type: string
                  errorMessage:
                    type: string
              examples:
                missing_rider_id:
                  summary: Missing rider_id header
                  value:
                    success: false
                    errorMessageKey: REQUIRED_FIELD_ERROR
                    errorMessage: Rider ID is required

                missing_trip_id:
                  summary: Missing tripId parameter
                  value:
                    success: false
                    errorMessageKey: REQUIRED_FIELD_ERROR
                    errorMessage: Trip ID is required

        "403":
          description: Forbidden - rider does not have access to this trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorMessageKey:
                    type: string
                    example: UNAUTHORIZED_ACCESS
                  errorMessage:
                    type: string
                    example: You are not authorized to view this trip

        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorMessageKey:
                    type: string
                    example: TRIP_NOT_FOUND
                  errorMessage:
                    type: string
                    example: Trip not found

        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errorMessageKey:
                    type: string
                    example: ERROR_FETCH_RIDER_TRIP_DETAIL
                  errorMessage:
                    type: string
                    example: Error fetching rider trip detail

  /intercity/v1/checkTripConflict:
    post:
      summary: Checks the trip conflict. actual path will be <baseurl>/b2c/driver/
      
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: driver_id
          required: false
          schema:
            type: string
          description: Driver ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - departureTime
                - pickup
                - destination
              properties:
                departureTime:
                  type: string
                pickup:
                  type: object
                  description: Pickup location path
                  properties:
                    lat:
                      type: number
                      description: Latitude of the pickup location
                    lng:
                      type: number
                      description: Longitude of the pickup location
                    path:
                      type: string
                      description: Level 1 path of the city (wilaya)
                destination:
                  type: string
               
            examples:
              trip:
                summary: Example
                value:
                  departureTime: "2026-02-10T08:00:00.000Z"
                  pickup:
                    lat: 36.752887
                    lng: 3.042048
                    path: "0,192756,1258648"
                  destination: "2,1,0"
      responses:
        "200":
          description: Trip conflict check successfull
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              examples:
                success:
                  summary: Trip time available
                  value:
                    success: true
                    message: Trip time available
               
        "400":
          description: Bad request - Invalid parameters or trip cannot be canceled
          content:
            application/json:
              examples:
                missing_time:
                  summary: Missing departureTime
                  value:
                    success: false
                    errorMessageKey: REQUIRED_FIELD_ERROR
                    errorMessage: Trip time is required
               
        "403":
          description: Time conflict found
          content:
            application/json:
              examples:
                missing_time:
                  summary: Missing departureTime
                  value:
                    success: false
                    errorMessageKey: TIME_CONFLICT_ERROR
                    errorMessage: You have an overlapping trip scheduled for this time
               
        
        "500":
          description: Server error
          content:
            application/json:
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    success: false
                    errorMessageKey: ERROR_CHECK_TRIP_CONFLICT

  /intercity/v1/cancelTrip:
    post:
      summary: Cancel an intercity trip and all related bookings. actual path will be <baseurl>/b2c/driver/
      description: |
        Allows a driver to cancel their trip. This will set the trip status to DRIVER_CANCELLED and cancel all related bookings.

        If the trip has confirmed bookings, cancellation is only allowed if the departure time is more than
        INTERCITY_TRIP_CANCEL_WINDOW (default: 2) hours in the future.
        Trips without bookings can be canceled at any time.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: driver_id
          required: false
          schema:
            type: string
          description: Driver ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tripId
              properties:
                tripId:
                  type: string
                  description: The ID of the trip to cancel
            examples:
              cancel-trip:
                summary: Example cancel trip request
                value:
                  tripId: "6550f8a8e4b0a2f9c8b0e1a3"
      responses:
        "200":
          description: Trip canceled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              examples:
                success:
                  summary: Trip canceled successfully
                  value:
                    success: true
                    message: Trip canceled successfully
        "400":
          description: Bad request - Invalid parameters or trip cannot be canceled
          content:
            application/json:
              examples:
                missing_trip_id:
                  summary: Missing trip ID
                  value:
                    success: false
                    errorMessageKey: REQUIRED_FIELD_ERROR
                    errorMessage: Trip ID is required
                missing_driver_id:
                  summary: Missing driver ID header
                  value:
                    success: false
                    errorMessageKey: REQUIRED_FIELD_ERROR
                    errorMessage: Driver ID is required
        "403":
          description: Forbidden - Not authorized to cancel this trip
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Not authorized to cancel trip
                  value:
                    success: false
                    errorMessageKey: VALIDATION_ERROR
                    errorMessage: You are not authorized to perform this action
                time_window:
                  summary: Cancellation time window passed
                  value:
                    success: false
                    errorMessageKey: CANCEL_WINDOW_EXPIRED
                    errorMessage: Cannot cancel trip with bookings less than 2 hours before departure
        "404":
          description: Trip not found
          content:
            application/json:
              examples:
                not_found:
                  summary: Trip not found
                  value:
                    success: false
                    errorMessageKey: NOT_FOUND
                    errorMessage: Trip not found
        "500":
          description: Server error
          content:
            application/json:
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    success: false
                    errorMessageKey: ERROR_CANCEL_TRIP
                    errorMessage: Error canceling the intercity trip
  
  /intercity/v1/trips:
    get:
      summary: Get driver's upcoming or past intercity trips with bookings
      description: Retrieves driver's trips. For UPCOMING trips, all trips are returned. For PAST trips (or when statusType is not UPCOMING), cursor-based pagination is applied when cursor/limit parameters are provided.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: statusType
          required: false
          schema:
            type: string
            enum: [UPCOMING, PAST]
            default: PAST
        - in: query
          name: cursor
          description: "first time dont send this. pass value next time received from api response"
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: header
          name: driver_id
          required: false
          schema:
            type: string
        - in: header
          name: app_language
          required: false
          schema:
            type: string
            default: en
      responses:
        "200":
          description: Trips retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  trips:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        tripUid:
                          type: string
                        status:
                          type: string
                        pickup:
                          type: object
                          properties:
                            address:
                              type: string
                            city:
                              type: string
                            distance:
                              type: number
                            departureTime:
                              type: string
                              format: date-time
                            lat:
                              type: number
                            lng:
                              type: number
                        destination:
                          type: object
                          properties:
                            address:
                              type: string
                            arrivalTime:
                              type: string
                              format: date-time
                            city:
                              type: string
                            lat:
                              type: number
                            lng:
                              type: number
                        price:
                          type: number
                        maxSeats:
                          type: number
                        currency:
                          type: string
                        currencyLabel:
                          type: string
                        bookings:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              seats:
                                type: number
                              riderProfile:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  rider:
                                    type: string
                                  email:
                                    type: string
                                  fullName:
                                    type: string
                                  firstName:
                                    type: string
                                  lastName:
                                    type: string
                                  gender:
                                    type: string
                                  phone:
                                    type: string
                                  rating:
                                    type: number
                                  reviewCount:
                                    type: number
                  nextCursor:
                    type: string
                    nullable: true
                  hasMore:
                    type: boolean
              examples:
                upcoming-trips:
                  summary: Upcoming trips without pagination
                  value:
                    success: true
