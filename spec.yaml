  /intercity/v1/validatePickup:
    post:
      summary: Validate driver's chosen pickup location if its in within the wilaya. actual path will be <baseurl>/b2c/driver/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupPath:
                  type: string
                  description: wilaya Path
                pickupLocation:
                  type: object
                  description: Pickup location path
                  properties:
                    lat:
                      type: number
                      description: Latitude of the pickup location
                    lng:
                      type: number
                      description: Longitude of the pickup location
                
            examples:
              basic:
                summary: Example success request
                value:
                  pickupPath: "1258647,192756,0"
                  pickupLocation:
                    lat: 36.752887
                    lng: 3.042048

                  
      security:
        - bearerAuth: []
      responses:
        '200':
          description: validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                 
              examples:
                success:
                  summary: Example successful response
                  value:
                    success: true
                    message: "Location is validated"
                error:
                  summary: Example error response
                  value:
                    success: true
                    message: "Location is not valid"
                   
  
        '400':
          description: Bad request
          content:
            application/json:
              examples:
                missing_fields:
                  summary: Missing required fields
                  value:
                    success: false
                    errorMessageKey: "REQUIRED_FIELD_ERROR"
                    errorMessage: "Pickup path is required"
                
  
        '500':
          description: Server error
          content:
            application/json:
              examples:
                server_error:
                  summary: Example error response
                  value:
                    success: false
                    errorMessageKey: "ERROR_VALIDATE_LOCATION"
                    errorMessage: "Error validating the pickup location"

  /intercity/v1/create-trip:
    post:
      summary: Create a new intercity trip. actual path will be <baseurl>/b2c/driver/
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup
                - destination
                - seats
                - price
                - departureTime
              properties:
                pickup:
                  type: object
                  description: Pickup location path
                  properties:
                    lat:
                      type: number
                      description: Latitude of the pickup location
                    lng:
                      type: number
                      description: Longitude of the pickup location
                    path:
                      type: string
                      description: Level 1 path of the city (wilaya)
                destination:
                  type: string
                  description: Destination location path i.e level 2
                seats:
                  type: number
                  minimum: 1
                  description: Number of available seats
                price:
                  type: number
                  minimum: 0
                  description: Trip price per seat
                departureTime:
                  type: string
                  format: date-time
                preview:
                  type: boolean
            examples:
              create-trip:
                summary: Example create trip request
                value:
                  pickup:
                    lat: 36.752887
                    lng: 3.042048
                    path: "0,192756,1258648"
                  destination: "0,192756,1258648"
                  seats: 4
                  price: 2500
                  departureTime: "2024-06-10T09:30:00Z"
                  preview: true
      responses:
        '200':
          description: Trip created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tripId:
                        type: string
                      driverPotentialEarning:
                        type: number
                      pricePerSeat:
                        type: number
                      pricePerSeatWithTax:
                        type: number
                      appliedTaxesDriver:
                        type: array
                        items:
                          type: object
                          properties:
                            id: 
                              type: string
                            riderProfile:
                              type: object
                              properties:
                                amount:
                                  type: number
                                label:
                                  type: string
                                
                      appliedTaxesRider:
                        type: array
                        items:
                          type: object
                          properties:
                            id: 
                              type: string
                            riderProfile:
                              type: object
                              properties:
                                amount:
                                  type: number
                                label:
                                  type: string
                     
                      yassirFee:
                        type: object
                        properties:
                          percent:
                            type: number
                          amount:
                            type: number
                      netEarning:
                        type: number
                      
            
            
                 
              examples:
                success:
                  summary: Example success response
                  value:
                    success: true
                    data:
                     tripId: "123456788"
                     pricePerSeat: 400
                     riderPay: 440
                     yassirFee: {percent: 20, amount: 200}
                     netEarning: 900
                     appliedTaxesRider: 
                      - label: "Stamp"
                        amount: 20
                      - label: "Fix Tax"
                        amount: 10
                        
                     appliedTaxesDriver: 
                      - label: "Flat Tax"
                        amount: 5

                     driverPotentialEarning: 1000
                    
                
        '400':
          description: Bad request, invalid or missing parameters
          content:
            application/json:
              examples:
                bad_request:
                  summary: Example bad request response
                  value:
                    success: false
                    errorMessageKey: "REQUIRED_FIELD_ERROR"
                    errorMessage: "Required fields are missing or invalid"
                invalid_pickup:
                  summary: Example of invalid location selection response
                  value:
                    success: false
                    errorMessageKey: "INVALID_PICKUP_COORDINATES"
                    errorMessage: "Pickup location is not within the specified city/wilaya"
        '500':
          description: Server error
          content:
            application/json:
              examples:
                create_error:
                  summary: Example error response
                  value:
                    success: false
                    errorMessageKey: "CREATE_TRIP_ERROR"
                    errorMessage: "Error creating the trip"
        '403':
          description: Not allowed
          content:
            application/json:
              examples:
                create_error:
                  summary: Example error response
                  value:
                    success: false
                    errorMessageKey: "TIME_CONFLICT_ERROR"
                    errorMessage: "Another trip at same time"

